name: Deploy encrypted PDFs to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PDF Index Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Encrypted Documents</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 60px auto; padding: 0 20px; color: #24292e; line-height: 1.6; }
                  h1 { font-size: 22px; border-bottom: 1px solid #eaecef; padding-bottom: 10px; margin-bottom: 20px; }
                  ul { padding-left: 20px; list-style-type: disc; }
                  li { margin: 12px 0; }
                  a { color: #0366d6; text-decoration: none; font-weight: 500; font-size: 16px; }
                  a:hover { text-decoration: underline; }
                  .footer { margin-top: 40px; font-size: 12px; color: #6a737d; border-top: 1px solid #eaecef; padding-top: 10px; }
              </style>
          </head>
          <body>
              <h1>🔒 My Encrypted PDFs</h1>
              <ul>
          EOF

          # Automatically add each PDF file to the HTML list
          for file in *.pdf; do
              if [ -f "$file" ]; then
                  echo "        <li><a href=\"$file\" target=\"_blank\">$file 📄</a></li>" >> index.html
              fi
          done

          cat << 'EOF' >> index.html
              </ul>
              <div class="footer">Automatically generated list of encrypted documents.</div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
